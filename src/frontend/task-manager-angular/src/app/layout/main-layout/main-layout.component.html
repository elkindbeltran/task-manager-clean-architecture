<div class="app-shell" [class.nav-collapsed]="isNavigationCollapsed">

  <aside class="side-nav">
    <a class="brand" routerLink="/tasks" aria-label="Task Manager home">
      <span class="brand-mark">TM</span>
      <span class="brand-copy">
        <strong>Task Manager</strong>
        <small>Clean Architecture</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a routerLink="/tasks" routerLinkActive="active" (click)="closeNavigationOnSmallScreen()">
        <mat-icon>task_alt</mat-icon>
        <span>Tasks</span>
      </a>

      <a routerLink="/users" routerLinkActive="active" (click)="closeNavigationOnSmallScreen()">
        <mat-icon>group</mat-icon>
        <span>Users</span>
      </a>
    </nav>

    <div class="nav-note">
      <span>Workspace</span>
      <strong>Secure task operations</strong>
    </div>
  </aside>

  <section class="workspace">
    <mat-toolbar class="topbar">
      <button
        mat-icon-button
        class="nav-toggle"
        type="button"
        (click)="toggleNavigation()"
        [attr.aria-label]="isNavigationCollapsed ? 'Show navigation' : 'Hide navigation'"
        [matTooltip]="isNavigationCollapsed ? 'Show navigation' : 'Hide navigation'">
        <mat-icon>{{ isNavigationCollapsed ? 'menu_open' : 'menu' }}</mat-icon>
      </button>

      <div class="topbar-title">
        <span>Operations Console</span>
        <strong>Task Management</strong>
      </div>

      <span class="spacer"></span>

      <div class="user-section" *ngIf="auth.user$ | async as user">
        <div class="avatar">
          {{ user.name?.charAt(0) }}
        </div>

        <span class="user-name">
          {{ user.name }}
        </span>

        <button mat-icon-button (click)="logout()" matTooltip="Logout" aria-label="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <span>Task Manager</span>
      <span>Clean Architecture UI</span>
    </footer>
  </section>

</div>
