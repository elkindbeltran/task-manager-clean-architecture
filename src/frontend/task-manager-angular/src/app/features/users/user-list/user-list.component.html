<div *ngIf="showProgressBar === true" class="page-progress">
  <mat-progress-bar mode="indeterminate" value="100"></mat-progress-bar>
</div>

<section class="page-hero">
  <div>
    <p class="eyebrow">Directory</p>
    <h1>Users</h1>
    <p class="page-description">
      Keep task ownership readable with a clean user directory for assignment and auditing.
    </p>
  </div>

  <button mat-flat-button class="primary-action" (click)="goToUserCreate()">
    <mat-icon>person_add</mat-icon>
    New User
  </button>
</section>

<section class="surface">
  <div class="surface-header">
    <div>
      <h2>Team members</h2>
      <span>{{ users.length }} registered users</span>
    </div>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="users">

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let user"> {{ user.createdAt | date:'mediumDate' }} </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">
          <code class="user-id">{{ user.id }}</code>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">
          <div class="user-cell">
            <span class="user-avatar">{{ user.name?.charAt(0) }}</span>
            <strong>{{ user.name }}</strong>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">
          <a class="email-link" href="mailto:{{ user.email }}">{{ user.email }}</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>
</section>
